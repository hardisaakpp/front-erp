# Disparadores estratégicos para el Frontend
trigger:
  branches:
    include:
      - main       # Producción
      - test       # Pruebas (DESA)
      - develop    # Desarrollo
      - ci/*
      - feature/*
      - fix/*

# Enrutamiento al servidor Ubuntu corporativo
pool:
  name: 'agents-srv-test'
  demands:
    - Agent.OS -equals Linux

variables:
  - group: acr-credentials 
  - name: nodeVersion
    value: '20.x'
  - name: acrLoginServer
    value: 'dockermg-g9hrgcc4etdrh8eg.azurecr.io'
  - name: imageName
    value: '$(acrLoginServer)/web-scnexus'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm

  # Lógica Declarativa de Prefijos Dinámicos y Base Path por Rama
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: envTag
      value: 'prod-latest'
    - name: uniqueTag
      value: 'prod-$(Build.BuildId)'
    - name: basePath
      value: '/'
  - ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
    - name: envTag
      value: 'test-latest'
    - name: uniqueTag
      value: 'test-$(Build.BuildId)'
    - name: basePath
      value: '/scnexus-front/'
  - ${{ elseif eq(variables['Build.SourceBranchName'], 'develop') }}:
    - name: envTag
      value: 'dev-latest'
    - name: uniqueTag
      value: 'dev-$(Build.BuildId)'
    - name: basePath
      value: '/scnexus-front/'
  - ${{ else }}:
    - name: envTag
      value: 'none'
    - name: uniqueTag
      value: 'none'
    - name: basePath
      value: '/'

stages:
# =====================================================================
# ETAPA 1: VALIDACIÓN Y PRUEBAS DEL FRONTEND (Vue 3 / TS)
# =====================================================================
- stage: CI_Validation
  displayName: 'Validación de Código y Tipado (Vue 3 / TS)'
  jobs:
  - job: Frontend_Checks
    displayName: 'Linting, Typecheck y Dependencias'
    steps:
    
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Instalar Node.js $(nodeVersion)'

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
           npm | "$(Agent.OS)"
        path: $(npm_config_cache)
      displayName: 'Caché de paquetes NPM'

    - script: |
        npm ci
      displayName: 'Instalar Dependencias (npm ci)'

    - script: |
        npx vue-tsc --noEmit
      displayName: 'Verificar Tipado Estricto (TypeScript)'

# =====================================================================
# ETAPA 2: CONSTRUCCIÓN DOCKER MULTICAPA Y PUBLICACIÓN EN ACR
# =====================================================================
- stage: Build_Docker
  displayName: 'Construcción y Empaquetado Nginx'
  dependsOn: CI_Validation
  condition: and(succeeded(), ne(variables.envTag, 'none'))
  jobs:
  - job: Docker_Build_Push
    displayName: 'Construir y Subir a Azure ACR'
    steps:

    # 2. IMPORTANTE: Mapeamos todo por 'env:' y usamos $VARIABLE en Bash
    - bash: |
        set -euo pipefail
        echo "0. Autenticando en Azure Container Registry..."
        printf '%s' "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin

        echo "1. Construyendo la imagen Frontend (Base Path: $BASE_PATH, Entorno: $ENV_TAG)..."
        docker build \
          --build-arg VITE_APP_BASE_PATH="$BASE_PATH" \
          -f "$DOCKERFILE_PATH" \
          -t "$IMAGE_NAME:$UNIQUE_TAG" \
          -t "$IMAGE_NAME:$ENV_TAG" .
        
        echo "2. Subiendo la imagen al registro corporativo en Azure..."
        docker push "$IMAGE_NAME:$UNIQUE_TAG"
        docker push "$IMAGE_NAME:$ENV_TAG"
      displayName: 'Empaquetar Nginx y Almacenar en ACR'
      env:
        ACR_USERNAME: $(acrUsername)
        ACR_PASSWORD: $(acrPassword)
        ACR_LOGIN_SERVER: $(acrLoginServer)
        BASE_PATH: $(basePath)
        ENV_TAG: $(envTag)
        UNIQUE_TAG: $(uniqueTag)
        IMAGE_NAME: $(imageName)
        DOCKERFILE_PATH: $(dockerfilePath)
      
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/deploy-info
        echo "$(uniqueTag)" > $(Build.ArtifactStagingDirectory)/deploy-info/image-tag.txt
        echo "Tag publicado para CD: $(uniqueTag)"
      displayName: 'Generar metadata de despliegue'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/deploy-info'
        ArtifactName: 'deploy-info'
      displayName: 'Publicar artefacto deploy-info'

    - bash: |
        docker logout "$(acrLoginServer)" || true
      displayName: 'Cerrar sesión de ACR'
      condition: always()