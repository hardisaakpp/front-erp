server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AUTH/me
    # Para este entorno dockerizado de desarrollo, usar Core para evitar
    # dependencia de un servicio local en host:8000 no disponible.
    location = /api/Auth/me {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/auth/me {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # AUTH -> CORE
    location /api/Auth/ {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CORE - rest of /api
    location /api/ {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Articulo Scanner API — debe ir ANTES del fallback del SPA (location /).
    # GET /scan-api/api/v1/warehouses → upstream GET /api/v1/warehouses
    # Mismo host:puerto que /api/ (Core). Si el microservicio de scan corre en otro puerto/IP,
    # cambiar solo este proxy_pass (p. ej. http://127.0.0.1:5000 desde el host sin Docker).
    location /scan-api/ {
        rewrite ^/scan-api(.*)$ $1 break;
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        client_max_body_size 50M;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA con base /articulo-scaner/: Vite sigue depositando archivos en la raíz de dist (index.html + assets/).
    # Las URLs públicas llevan prefijo /articulo-scaner/ … — reescribe a la raíz del docroot antes de try_files.
    location = /articulo-scaner {
        return 302 /articulo-scaner/;
    }

    # El front llama /scan-api/... en la raíz del dominio, no bajo /articulo-scaner/.
    # Sin esto, /articulo-scaner/scan-api/... cae en try_files y devuelve HTML del SPA.
    location ^~ /articulo-scaner/scan-api/ {
        rewrite ^/articulo-scaner/(scan-api/.*)$ /$1 permanent;
    }

    location ^~ /articulo-scaner/ {
        rewrite ^/articulo-scaner/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
