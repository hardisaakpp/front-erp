server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AUTH/me
    # Para este entorno dockerizado de desarrollo, usar Core para evitar
    # dependencia de un servicio local en host:8000 no disponible.
    location = /api/Auth/me {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/auth/me {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # AUTH -> CORE
    location /api/Auth/ {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CORE - rest of /api
    location /api/ {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Legacy: subruta antigua del SPA → /scnexus-front/… (QRs, favoritos).
    location ^~ /articulo-scaner/scan-api/ {
        rewrite ^/articulo-scaner/scan-api/(.*)$ /scan-api/$1 permanent;
    }
    location = /articulo-scaner {
        return 301 /scnexus-front/;
    }
    location ^~ /articulo-scaner/ {
        rewrite ^/articulo-scaner/(.*)$ /scnexus-front/$1 permanent;
    }

    # Si alguien pide /scnexus-front/scan-api/... (URL incorrecta), redirigir a /scan-api/...
    # El bundle usa siempre /scan-api/ en la raíz del dominio, no bajo el base del SPA.
    location ^~ /scnexus-front/scan-api/ {
        rewrite ^/scnexus-front/scan-api/(.*)$ /scan-api/$1 permanent;
    }

    # Articulo Scanner API — debe ir ANTES del fallback del SPA (location /).
    # GET /scan-api/api/v1/warehouses → upstream GET /api/v1/warehouses
    # __SCAN_API_UPSTREAM__ se reemplaza al construir la imagen (Dockerfile ARG SCAN_API_UPSTREAM).
    location /scan-api/ {
        rewrite ^/scan-api(.*)$ $1 break;
        proxy_pass __SCAN_API_UPSTREAM__;
        proxy_http_version 1.1;
        client_max_body_size 50M;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Evitar Host=codigoqr... en el Core remoto si el API de scan es local y Kestrel no conoce ese vhost.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Promoción Sobres API — antes del fallback del SPA.
    # GET /promocion-sobres-api/api/promocion-sobres/v1/beneficiarios/{id} → upstream mismo path sin prefijo.
    # __PROMOCION_SOBRES_API_UPSTREAM__ se reemplaza al construir la imagen (Dockerfile).
    location /promocion-sobres-api/ {
        rewrite ^/promocion-sobres-api(.*)$ $1 break;
        proxy_pass __PROMOCION_SOBRES_API_UPSTREAM__;
        proxy_http_version 1.1;
        client_max_body_size 50M;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache off;
        proxy_buffering off;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA con base /scnexus-front/: Vite deja index.html y assets/ en la raíz del docroot.
    # Los <script src="/scnexus-front/assets/..."> deben mapear a /usr/share/nginx/html/assets/...
    # (alias explícito evita 404 por interacción rewrite+try_files con algunos clientes/proxies).
    location ^~ /scnexus-front/assets/ {
        alias /usr/share/nginx/html/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /scnexus-front {
        return 302 /scnexus-front/;
    }

    location ^~ /scnexus-front/ {
        rewrite ^/scnexus-front/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
