# Origen: srv-mabuiosapi — /etc/apache2/sites-available/glpi.conf
# Enabled: sites-enabled/glpi.conf — solo :80
# NO modificar por migración SCNexus Docker.

<VirtualHost *:80>

    ServerName 192.168.2.153
    ServerAlias glpi.local

    DocumentRoot /storage/glpi/public

    <Directory /storage/glpi/public>
        Require all granted
        Options FollowSymLinks
        AllowOverride All

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/glpi_error.log
    CustomLog ${APACHE_LOG_DIR}/glpi_access.log combined
</VirtualHost>
