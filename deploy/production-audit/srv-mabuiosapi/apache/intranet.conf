# Origen: srv-mabuiosapi — /etc/apache2/sites-available/intranet.conf
# Enabled: sites-enabled/002-intranet.conf
# NO modificar por migración SCNexus Docker.

# Intranet – HTTP
<VirtualHost *:80>
    ServerName intranet.mabelgroup.com.ec
    DocumentRoot /storage
    <Directory /storage>
        Require all granted
        Options FollowSymLinks
        AllowOverride All
    </Directory>
</VirtualHost>

# Intranet – HTTPS
<VirtualHost *:443>
    ServerName intranet.mabelgroup.com.ec

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key
    SSLCertificateChainFile /etc/ssl/certs/bundle.crt

    DocumentRoot /storage
    <Directory /storage>
        Require all granted
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/intranet_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/intranet_ssl_access.log combined
</VirtualHost>
