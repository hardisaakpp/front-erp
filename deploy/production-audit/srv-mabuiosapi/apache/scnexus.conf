# Origen: srv-mabuiosapi — /etc/apache2/sites-available/scnexus.conf
# Enabled: sites-enabled/003-scnexus.conf
# Fecha en repo: 2026-03-21 — solo referencia (no desplegar desde git al servidor)
#
# Corte Docker: simplificar a ProxyPass / → http://127.0.0.1:8082/
# Ver deploy/apache/003-scnexus-docker.conf.example

# SCNexus – HTTPS (scnexus.mabelgroup.com.ec)
<VirtualHost *:443>
    ServerName scnexus.mabelgroup.com.ec

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key
    SSLCertificateChainFile /etc/ssl/certs/bundle.crt

    ProxyPreserveHost On

    # --- API: rutas más específicas primero ---
    # Auth/me → mba3 (capabilities)
    ProxyPass /api/Auth/me http://127.0.0.1:8000/api/Auth/me
    ProxyPassReverse /api/Auth/me http://127.0.0.1:8000/api/Auth/me
    ProxyPass /api/auth/me http://127.0.0.1:8000/api/auth/me
    ProxyPassReverse /api/auth/me http://127.0.0.1:8000/api/auth/me

    # Auth (login, etc.) → Core
    ProxyPass /api/Auth/ http://192.168.2.12:8080/api/Auth/
    ProxyPassReverse /api/Auth/ http://192.168.2.12:8080/api/Auth/

    # MBA3 → backend en 8000 (se quita prefijo /api/mba3)
    ProxyPass /api/mba3/ http://127.0.0.1:8000/
    ProxyPassReverse /api/mba3/ http://127.0.0.1:8000/

    # Resto de /api (Users, Roles, Permissions, etc.) → Core
    ProxyPass /api/ http://192.168.2.12:8080/api/
    ProxyPassReverse /api/ http://192.168.2.12:8080/api/

    # SPA (todo lo demás) → Nginx en 3001
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/scnexus_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/scnexus_ssl_access.log combined
</VirtualHost>
