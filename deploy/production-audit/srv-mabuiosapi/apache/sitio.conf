# Origen: srv-mabuiosapi — /etc/apache2/sites-available/sitio.conf
# Enabled: sites-enabled/000-sitio.conf — default vhost :443 (sapi)
# NO modificar por migración SCNexus Docker.

<VirtualHost *:80>
        ServerAdmin acolumba@mabeltrading.com.ec
	DocumentRoot /storage
        <Directory /storage>
                Require all granted
        </Directory>

        ServerName sapi
        Redirect / https://192.168.2.153/

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
   ServerName sapi
   ServerAlias 192.168.2.153

   DocumentRoot /storage

  <Directory /storage>
        Require all granted
  </Directory>

   SSLEngine on
   SSLCertificateFile /etc/ssl/certs/server.crt
   SSLCertificateKeyFile /etc/ssl/private/server.key
   SSLCertificateChainFile /etc/ssl/certs/bundle.crt

   ErrorLog ${APACHE_LOG_DIR}/sapi_ssl_error.log
   CustomLog ${APACHE_LOG_DIR}/sapi_ssl_access.log combined
</VirtualHost>
