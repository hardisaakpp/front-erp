# Origen: srv-mabuiosapi — /etc/apache2/sites-available/storecontrol.conf
# NO modificar por migración SCNexus Docker.
# Nota: :80 reenvía a Nginx :3001 (mismo puerto que SCNexus host) — cuidado al depurar puertos.

<VirtualHost *:80>
    ServerName storecontrol.mabelgroup.com.ec
    ProxyPreserveHost On
    ProxyPass "/" "http://127.0.0.1:3001/"
    ProxyPassReverse "/" "http://127.0.0.1:3001/"
</VirtualHost>

# HTTPS para storecontrol (evita que caiga en scnexus)
<VirtualHost *:443>
    ServerName storecontrol.mabelgroup.com.ec

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key
    SSLCertificateChainFile /etc/ssl/certs/bundle.crt

    DocumentRoot /storage
    <Directory /storage>
        Require all granted
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/storecontrol_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/storecontrol_ssl_access.log combined
</VirtualHost>
