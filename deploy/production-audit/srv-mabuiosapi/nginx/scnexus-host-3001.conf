# Nginx HOST prod — listen 3001 (scnexus.mabelgroup.com.ec)
# Servidor: /etc/nginx/sites-available/scnexus
# Fecha repo: 2026-03-21 — confirmar con export del servidor si difiere
#
# Tras Docker: Apache → :8082; este archivo queda solo rollback.
# IPs en proxy_pass pueden estar obsoletas (Core :5053, cajachica :8092 en mismo host).
# location /inventario-api/ usa :8082 — conflicto con SCNEXUS_FRONT_PORT planificado.

server {
    listen 3001;
    server_name scnexus.mabelgroup.com.ec;

    root /storage/scnexus/dist;
    index index.html;

    # =========================
    # AUTH/me -> mba3-consultas (capabilities)
    # =========================
    location = /api/Auth/me {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/auth/me {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # AUTH -> CORE
    # =========================
    location /api/Auth/ {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # SSE stream (must be before /api/mba3/)
    # =========================
    location = /api/mba3/notificaciones/stream {
        rewrite ^/api/mba3(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # =========================
    # MBA3 Consultas API (/api/mba3/* -> backend without prefix)
    # =========================
    location /api/mba3/ {
        rewrite ^/api/mba3(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # Caja Chica API (/caja-chica-api/* -> backend /api/*)
    # =========================
    location /caja-chica-api/ {
        rewrite ^/caja-chica-api(.*)$ /api$1 break;
        proxy_pass http://192.168.2.211:8092;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # Caja Chica uploads (/uploads/* -> backend /uploads/*)
    # Required so image URLs like /uploads/xxx.jpeg work in production.
    # =========================
    # Use ^~ so this prefix wins over the generic static regex location (~* \.(jpg|jpeg|...))
    location ^~ /uploads/ {
        proxy_pass http://192.168.2.211:8092;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # PYG API (/pyg-api/* -> backend /api/*)
    # =========================
    location /pyg-api/ {
        rewrite ^/pyg-api(.*)$ /api$1 break;
        proxy_pass http://127.0.0.1:5171;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # Articulo Scanner API (/scan-api/* -> backend same path without prefix)
    # Example:
    #   /scan-api/api/v1/warehouses -> http://127.0.0.1:8080/api/v1/warehouses
    # Keep this block above the SPA fallback to avoid returning index.html.
    # =========================
    location /scan-api/ {
        rewrite ^/scan-api(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # Promoción Sobres API (/promocion-sobres-api/* -> backend same path without prefix)
    # Example:
    #   /promocion-sobres-api/api/promocion-sobres/v1/beneficiarios/... -> http://127.0.0.1:8083/api/promocion-sobres/v1/...
    # =========================
    location /promocion-sobres-api/ {
        rewrite ^/promocion-sobres-api(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # Inventario API (/inventario-api/* -> backend same path without prefix)
    # Example:
    #   /inventario-api/api/v1/inventory-plannings -> http://127.0.0.1:8082/api/v1/inventory-plannings
    # Keep this block above the SPA fallback to avoid returning index.html.
    # =========================
    location /inventario-api/ {
        rewrite ^/inventario-api(.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        client_max_body_size 50M;

        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # CORE - rest of /api
    # =========================
    location /api/ {
        proxy_pass http://192.168.2.12:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # STORE EMPLOYEES (PHP)
    # =========================
    location ^~ /employees-api/ {
        alias /opt/klienteV1/cws/api/;
        index store_employees.php;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # =========================
    # SPA
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
