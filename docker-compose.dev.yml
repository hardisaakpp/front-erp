# Desarrollo: Vite en :3000. Mismo nombre de contenedor que prod (scnexus-front); no correr ambos a la vez.
# Proyecto compose distinto (scnexus-front-dev) solo para aislar volúmenes/redes de docker-compose.yml.
# Con MBA3 en Docker: docker compose -f docker-compose.dev.yml -f docker-compose.mba3-network.attach.yml up -d
name: scnexus-front-dev

services:
  scnexus-front:
    image: node:20-alpine
    container_name: scnexus-front
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
      VITE_CORE_PROXY_TARGET: ${VITE_CORE_PROXY_TARGET:-http://192.168.2.12:8080}
      VITE_MBA3_PROXY_TARGET: ${VITE_MBA3_PROXY_TARGET:-http://host.docker.internal:8000}
      VITE_AUTH_ME_PROXY_TARGET: ${VITE_AUTH_ME_PROXY_TARGET:-http://host.docker.internal:8000}
      VITE_CAJA_CHICA_PROXY_TARGET: ${VITE_CAJA_CHICA_PROXY_TARGET:-http://192.168.2.153:8092}
      VITE_PYG_PROXY_TARGET: ${VITE_PYG_PROXY_TARGET:-http://host.docker.internal:5171}
      VITE_ARTICULO_SCAN_PROXY_TARGET: ${VITE_ARTICULO_SCAN_PROXY_TARGET:-http://host.docker.internal:8080}
      VITE_INVENTARIO_PROXY_TARGET: ${VITE_INVENTARIO_PROXY_TARGET:-http://host.docker.internal:8082}
      VITE_PROMOCION_SOBRES_PROXY_TARGET: ${VITE_PROMOCION_SOBRES_PROXY_TARGET:-http://host.docker.internal:8083}
      VITE_CONCILIACION_PROXY_TARGET: ${VITE_CONCILIACION_PROXY_TARGET:-http://host.docker.internal:8005}
      VITE_MAESTRO_API_TARGET: ${VITE_MAESTRO_API_TARGET:-http://host.docker.internal:8001}
      VITE_SLAYER_PROXY_TARGET: ${VITE_SLAYER_PROXY_TARGET:-http://host.docker.internal:8093}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - scnexus-front-node-modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  scnexus-front-node-modules:
