# Desarrollo en contenedor SCNexus (:3000)
# Uso: docker compose -f docker-compose.dev.yml up -d
name: scnexus-front-dev

services:
  scnexus-front-dev:
    image: node:20-alpine
    container_name: scnexus-front-dev
    working_dir: /app
    # Ejecuta el servidor de desarrollo de Vite
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    env_file:
      - deploy/env/bundle.env
      - path: deploy/env/active.env
        required: false
    environment:
      SCNEXUS_PROFILE: ${SCNEXUS_PROFILE:-local}
      # Upstreams de backend (Prioridad variable de entorno > active.env > Default)
      UPSTREAM_CORE: ${UPSTREAM_CORE:-${CORE_UPSTREAM:-http://192.168.2.12:8080}}
      UPSTREAM_MBA3: ${UPSTREAM_MBA3:-http://host.docker.internal:8000}
      UPSTREAM_MBA3_AUTH: ${UPSTREAM_MBA3_AUTH:-http://host.docker.internal:8000}
      UPSTREAM_CAJA_CHICA: ${UPSTREAM_CAJA_CHICA:-http://host.docker.internal:8092}
      UPSTREAM_PYG: ${UPSTREAM_PYG:-http://host.docker.internal:5171}
      UPSTREAM_PYG_PREFIX: ${UPSTREAM_PYG_PREFIX:-/api}
      UPSTREAM_MAESTRO: ${UPSTREAM_MAESTRO:-http://host.docker.internal:8004}
      UPSTREAM_CONCILIACION: ${UPSTREAM_CONCILIACION:-http://host.docker.internal:8005}
      UPSTREAM_REPOSICION: ${UPSTREAM_REPOSICION:-http://host.docker.internal:8006}
      UPSTREAM_SCAN: ${UPSTREAM_SCAN:-http://host.docker.internal:8080}
      UPSTREAM_INVENTARIO: ${UPSTREAM_INVENTARIO:-http://host.docker.internal:8082}
      UPSTREAM_PROMOCION_SOBRES: ${UPSTREAM_PROMOCION_SOBRES:-http://host.docker.internal:8083}
      UPSTREAM_SLAYER: ${UPSTREAM_SLAYER:-http://host.docker.internal:8093}
      UPSTREAM_MIA: ${UPSTREAM_MIA:-http://172.30.152.246:8896}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - scnexus-front-node-modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  scnexus-front-node-modules:
