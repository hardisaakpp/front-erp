# Levantar antes mba3-consultas (`docker compose up -d`) para que exista la red `mba3-nexus_edge`.
# El navegador sigue llamando a /mba3-api vía localhost:3000; Vite reenvía al contenedor `mba3-api:8000`.
services:
  scnexus-front-dev:
    image: node:20-alpine
    container_name: scnexus-front-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      # Dev must use Vite proxy (no nginx in front).
      # Defaults asumen API MBA3 en Docker en la red compartida `mba3-nexus_edge` (hostname `mba3-api`).
      VITE_ARTICULO_SCAN_PROXY_TARGET: ${VITE_ARTICULO_SCAN_PROXY_TARGET:-http://host.docker.internal:8080}
      VITE_PYG_PROXY_TARGET: ${VITE_PYG_PROXY_TARGET:-http://host.docker.internal:5171}
      VITE_MBA3_PROXY_TARGET: ${VITE_MBA3_PROXY_TARGET:-http://mba3-api:8000}
      VITE_AUTH_ME_PROXY_TARGET: ${VITE_AUTH_ME_PROXY_TARGET:-http://mba3-api:8000}
      VITE_CORE_PROXY_TARGET: ${VITE_CORE_PROXY_TARGET:-http://192.168.2.12:8080}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - scnexus-front-node-modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mba3-nexus_edge
    restart: unless-stopped

networks:
  mba3-nexus_edge:
    name: mba3-nexus_edge
    external: true

volumes:
  scnexus-front-node-modules:
