# Red externa creada por mba3-consultas (nombre fijo `mba3-nexus_edge`, contenedor API `mba3-api:8000`).
# Uso (después de `docker compose up -d` en el repo backend):
#   docker compose -f docker-compose.yml -f docker-compose.mba3-network.attach.yml up -d
services:
  scnexus-front-public:
    networks:
      - default
      - mba3-nexus_edge

networks:
  mba3-nexus_edge:
    name: mba3-nexus_edge
    external: true
