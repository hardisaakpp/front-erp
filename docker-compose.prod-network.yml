# Producción srv-mabuiosapi: MBA3, PYG y Cajachica por DNS en redes externas.
# Cajachica: red user-defined cajachica_net (NO bridge — la IP bridge cambia al recrear el contenedor).
# Empleados: UPSTREAM_EMPLOYEES=http://host.docker.internal:3001 (Nginx host con PHP).
# Prerequisito: docker network create cajachica_net && docker network connect cajachica_net cajachica
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod-network.yml \
#     --env-file deploy/env/active.env up -d --build

services:
  scnexus-front:
    networks:
      - default
      - mba3-nexus_edge
      - scnexus-pyg_default
      - conciliacion-bancaria_default
      - articulomaestro_default
      - reposiciones_default
      - cajachica_net

networks:
  mba3-nexus_edge:
    name: mba3-nexus_edge
    external: true
  scnexus-pyg_default:
    name: scnexus-pyg_default
    external: true
  conciliacion-bancaria_default:
    name: conciliacion-bancaria_default
    external: true
  articulomaestro_default:
    name: articulomaestro_default
    external: true
  reposiciones_default:
    name: reposiciones_default
    external: true
  cajachica_net:
    name: cajachica_net
    external: true
