services:
  scnexus-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Subruta bajo mismo dominio (Apache + legacy en codigoqr). Sin esto, el HTML pide /assets/* en la raíz y Apache devuelve 404 (no pasa al contenedor).
        # Despliegue solo esta SPA en la raíz del host: en `.env` definir `VITE_APP_BASE_PATH=/`.
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/articulo-scaner/}
    image: scnexus-front:latest
    container_name: scnexus-front
    ports:
      - "${SCNEXUS_FRONT_PORT:-8081}:80"
    # Permite que Nginx (scnexus-spa.conf) alcance el API de scan en el host (p. ej. :8080).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
