# Producción / preproducción intranet: imagen con Nginx + SPA + proxy a backends.
# Copiar .env.docker.example → .env y ajustar IPs antes de build.
name: scnexus-front

services:
  scnexus-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
        MBA3_UPSTREAM: ${MBA3_UPSTREAM:-http://host.docker.internal:8000}
        CORE_UPSTREAM: ${CORE_UPSTREAM:-http://192.168.2.12:8080}
        CAJA_CHICA_UPSTREAM: ${CAJA_CHICA_UPSTREAM:-http://192.168.2.211:8092}
        PYG_UPSTREAM: ${PYG_UPSTREAM:-http://host.docker.internal:5171}
        SCAN_API_UPSTREAM: ${SCAN_API_UPSTREAM:-http://host.docker.internal:8080}
        PROMOCION_SOBRES_UPSTREAM: ${PROMOCION_SOBRES_UPSTREAM:-http://host.docker.internal:8083}
        INVENTARIO_UPSTREAM: ${INVENTARIO_UPSTREAM:-http://host.docker.internal:8082}
        CONCILIACION_UPSTREAM: ${CONCILIACION_UPSTREAM:-http://host.docker.internal:8005}
        MAESTRO_UPSTREAM: ${MAESTRO_UPSTREAM:-http://host.docker.internal:8001}
        SLAYER_UPSTREAM: ${SLAYER_UPSTREAM:-http://host.docker.internal:8093}
    image: scnexus-front:latest
    container_name: scnexus-front
    ports:
      - "${SCNEXUS_FRONT_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
