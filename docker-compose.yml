# Nginx + SPA en :8085. Los UPSTREAM_* se inyectan en runtime desde active.env.
# Obligatorio: deploy/env/active.env (ver deploy/env/local.docker.env.example)
#   cp deploy/env/local.docker.env.example deploy/env/active.env
#   docker compose up -d --build
#
# Despliegue paralelo (mismo servidor, otro nombre/puerto): definir CONTAINER_NAME
# y SCNEXUS_FRONT_PORT en active.env. Vacías -> se despliega igual que hoy
# (project/contenedor "scnexus-front"). Con valor -> stack independiente
# (name/container_name propios), sin tocar el despliegue por defecto.
name: ${CONTAINER_NAME:-scnexus-front}

services:
  scnexus-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/scnexus-front/}
    image: scnexus-front:${CONTAINER_NAME:-latest}
    container_name: ${CONTAINER_NAME:-scnexus-front}
    env_file:
      - path: deploy/env/bundle.env
        required: true
      - path: deploy/env/active.env
        required: false
      - path: deploy/env/active.docker.env
        required: false

    ports:
      - "${SCNEXUS_FRONT_PORT:-8085}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CAJA_CHICA_LEGACY_MEDIA_HOST:-/media/scnexus-cajachica}:/var/lib/caja-chica-legacy:ro
    networks:
      - default
      - mba3_net
    restart: unless-stopped

networks:
  default: {}
  mba3_net:
    external: true
    name: mba3-consultas_default
