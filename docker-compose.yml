# Imagen/contenedor: scnexus-front-public (servidor público .39). No confundir con scnexus-front (intranet).
services:
  scnexus-front-public:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Subruta bajo mismo dominio (Apache + legacy en codigoqr). Sin esto, el HTML pide /assets/* en la raíz y Apache devuelve 404 (no pasa al contenedor).
        # Despliegue solo esta SPA en la raíz del host: en `.env` definir `VITE_APP_BASE_PATH=/`.
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/scnexus-front/}
        # Nginx: proxy de /scan-api/* hacia el .NET de escaneo (sin slash final en la URL).
        # 192.168.2.153 = srv-mabuiosapi (contenedor scnexus-articulo-api en :8080).
        SCAN_API_UPSTREAM: ${SCAN_API_UPSTREAM:-http://192.168.2.153:8080}
        # scnexus-validacionCI (docker compose / dotnet run en el host, puerto 8083).
        PROMOCION_SOBRES_API_UPSTREAM: ${PROMOCION_SOBRES_API_UPSTREAM:-http://host.docker.internal:8083}
    image: scnexus-front-public:latest
    container_name: scnexus-front-public
    ports:
      - "${SCNEXUS_FRONT_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# Red MBA3 opcional (dev): docker compose -f docker-compose.yml -f docker-compose.mba3-network.attach.yml up -d
