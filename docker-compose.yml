# Nginx + SPA en :8082. Los UPSTREAM_* se hornean en la imagen al hacer build.
# Obligatorio: deploy/env/active.env (ver deploy/env/local.docker.env.example)
#   npm run docker:env && npm run docker:up
#   — o — docker compose --env-file deploy/env/active.env up -d --build
name: scnexus-front

services:
  scnexus-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
        MBA3_UPSTREAM: ${UPSTREAM_MBA3:-http://127.0.0.1:8000}
        CORE_UPSTREAM: ${UPSTREAM_CORE:-http://127.0.0.1:8080}
        CAJA_CHICA_UPSTREAM: ${UPSTREAM_CAJA_CHICA:-http://127.0.0.1:8092}
        PYG_UPSTREAM: ${UPSTREAM_PYG:-http://127.0.0.1:5171}
        SCAN_API_UPSTREAM: ${UPSTREAM_SCAN:-http://127.0.0.1:8080}
        PROMOCION_SOBRES_UPSTREAM: ${UPSTREAM_PROMOCION_SOBRES:-http://127.0.0.1:8083}
        INVENTARIO_UPSTREAM: ${UPSTREAM_INVENTARIO:-http://127.0.0.1:8082}
        CONCILIACION_UPSTREAM: ${UPSTREAM_CONCILIACION:-http://127.0.0.1:8005}
        MAESTRO_UPSTREAM: ${UPSTREAM_MAESTRO:-http://127.0.0.1:8001}
        SLAYER_UPSTREAM: ${UPSTREAM_SLAYER:-http://127.0.0.1:8093}
    image: scnexus-front:latest
    container_name: scnexus-front
    env_file:
      - path: deploy/env/bundle.env
        required: true
      - path: deploy/env/active.env
        required: false
    ports:
      - "${SCNEXUS_FRONT_PORT:-8082}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
