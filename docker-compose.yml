# Nginx + SPA en :8082. Los UPSTREAM_* se inyectan en runtime desde active.env.
# Obligatorio: deploy/env/active.env (ver deploy/env/local.docker.env.example)
#   cp deploy/env/local.docker.env.example deploy/env/active.env
#   docker compose up -d --build
name: scnexus-front

services:
  scnexus-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/scnexus-front/}
    image: scnexus-front:latest
    container_name: scnexus-front
    env_file:
      - path: deploy/env/bundle.env
        required: true
      - path: deploy/env/active.env
        required: false
      - path: deploy/env/active.docker.env
        required: false
    ports:
      - "${SCNEXUS_FRONT_PORT:-8082}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CAJA_CHICA_LEGACY_MEDIA_HOST:-/media/scnexus-cajachica}:/var/lib/caja-chica-legacy:ro
    restart: unless-stopped
